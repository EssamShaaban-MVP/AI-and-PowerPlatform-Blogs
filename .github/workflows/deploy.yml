name: Deploy Astro to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default; each job requests only what it needs.
permissions: {}

# One deployment at a time; a newer push cancels an in-progress one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Pages variables
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          [ -n "$SITE_URL" ]  || echo "::warning::Repository variable SITE_URL is not set; canonical URLs will use https://example.github.io"
          [ -n "$BASE_PATH" ] || echo "::warning::Repository variable BASE_PATH is not set; the site will be built for the domain root (/)"

      - name: Install, build and upload Pages artifact
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write    # publish to GitHub Pages
      id-token: write # OIDC token required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
